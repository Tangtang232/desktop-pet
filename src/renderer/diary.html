<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>它的日记</title>
  <link rel="stylesheet" href="note.css">
  <style>
    .paper { grid-template-rows: auto 1fr; padding: 22px 18px 16px 34px; }
    .paper::after { bottom: 14px; }
    .top { display: flex; align-items: baseline; }
    .top .drag { flex: 1; }
    .x { -webkit-app-region: no-drag; border: 0; background: transparent; color: var(--ink-soft); font: 20px var(--ui); padding: 0 4px; cursor: pointer; }
    main { min-height: 0; overflow-y: auto; padding: 4px 6px 4px 0; }
    main::-webkit-scrollbar { width: 6px; }
    main::-webkit-scrollbar-thumb { background: rgba(176, 122, 70, .35); border-radius: 3px; }
    main::-webkit-scrollbar-track { background: transparent; }
    .day { font: 600 15px var(--hand); color: var(--accent); margin: 10px 0 2px; }
    .day:first-child { margin-top: 2px; }
    .entry { display: grid; grid-template-columns: 3.2em 1fr; gap: 6px; font: 19px/1.5 var(--hand); color: var(--ink); }
    .entry time { color: var(--ink-soft); font-size: 15px; padding-top: 2px; }
    .empty { font: 19px/1.6 var(--hand); color: var(--ink-soft); margin-top: 12px; }
  </style>
</head>
<body>
  <div class="paper">
    <div class="top"><div class="drag">它的日记</div><button class="x" id="close" title="关上" aria-label="关上">×</button></div>
    <main id="main"></main>
  </div>
  <script src="diary.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>一起养</title>
  <link rel="stylesheet" href="note.css">
  <style>
    .paper { grid-template-rows: auto 1fr; padding: 22px 22px 18px 34px; }
    .paper::after { bottom: 16px; }
    .top { display: flex; align-items: baseline; }
    .top .drag { flex: 1; }
    .x { -webkit-app-region: no-drag; border: 0; background: transparent; color: var(--ink-soft); font: 20px var(--ui); padding: 0 4px; cursor: pointer; }
    main { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-top: 6px; padding-right: 4px; }
    main::-webkit-scrollbar { width: 6px; }
    main::-webkit-scrollbar-thumb { background: rgba(176, 122, 70, .35); border-radius: 3px; }
    main::-webkit-scrollbar-track { background: transparent; }
    .big { font: 22px/1.4 var(--hand); color: var(--ink); }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .row2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button.wide { padding: 9px 14px; font-size: 15px; }
    input { box-sizing: border-box; font: 18px var(--hand); color: var(--ink); background: rgba(255, 255, 255, .65);
      border: 1px solid var(--paper-edge); border-radius: 8px; padding: 5px 10px; outline: none; min-width: 0; }
    input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    input.code { flex: 1; letter-spacing: .12em; text-transform: uppercase; font: 17px ui-monospace, Consolas, monospace; }
    .err { color: #B23A2A; font-size: 13px; }
    .err:empty { display: none; }
    .people { display: flex; gap: 14px; flex-wrap: wrap; font: 18px var(--hand); }
    .who { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #C8B9A6; flex: none; }
    .dot.on { background: #5BA35B; }
    .me { border: 0; background: transparent; font: inherit; color: var(--ink); padding: 0; cursor: pointer; border-bottom: 1px dashed var(--paper-edge); }
    .code-line { margin-top: auto; display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-size: 13px; }
    .code-line b { font: 600 17px ui-monospace, Consolas, monospace; letter-spacing: .08em; color: var(--ink); user-select: all; }
    .link { border: 0; background: transparent; color: var(--ink-soft); font: 13px var(--ui); padding: 0; cursor: pointer; text-decoration: underline; }
    button.small { padding: 3px 12px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="paper">
    <div class="top"><div class="drag">一起养</div><button class="x" id="close" title="关上" aria-label="关上">×</button></div>
    <main id="main"></main>
  </div>
  <script src="together.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>写纸条</title>
  <link rel="stylesheet" href="note.css">
</head>
<body>
  <form class="paper" id="form">
    <div class="drag" id="head">写张纸条</div>
    <textarea id="text" maxlength="160" placeholder="想说点什么？" autofocus></textarea>
    <div class="row">
      <span class="count" id="count">0 / 120</span>
      <button type="button" class="ghost" id="cancel">算了</button>
      <button type="submit" class="go" id="send" disabled>交给它</button>
    </div>
    <p class="hint" id="hint"></p>
  </form>
  <script src="note.js"></script>
</body>
</html>
